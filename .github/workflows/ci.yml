name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same PR cancels the previous run rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # There is no test suite yet (Phase 6). Until there is, the meaningful check
      # is that every module still loads — which catches the broken import or
      # syntax error that would otherwise only surface when a call comes in.
      - name: Modules load
        run: node scripts/ci-import-check.js

      - name: Secrets not committed
        run: |
          if git ls-files | grep -iE 'service-account|credentials\.json|^\.env$'; then
            echo "::error::A credential file is tracked in git"
            exit 1
          fi
          echo "No credential files tracked."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Named project, so a missing tsconfig.json is an error rather than a
      # silent pass — see the Phase 0 commit for why that matters.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t voice-agent:ci .
